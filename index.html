<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Охотники Мрака" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#0b0a10" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Охотники Мрака — Grimborne Hunters</title>
  <link rel="icon" type="image/x-icon" href="./assets/grimborne_icon.ico?v=20261117z25" />
  <link rel="apple-touch-icon" sizes="192x192" href="./assets/icon-192.png?v=20261124z99" />
  <link rel="manifest" href="./manifest.json?v=20261124z99" />
  <link rel="stylesheet" href="./css/style.css?v=20261124z99" />
  <script>
    (function syncViewportVars() {
      var curVp = { w: 1280, h: 720, forcedRotate: false, rawW: 1280, rawH: 720 };
      window.__getGameViewportSize = function () { return curVp; };
      window.__toGameCoords = function (cx, cy) {
        if (curVp.forcedRotate) {
          return { x: cy, y: curVp.rawW - cx };
        }
        return { x: cx, y: cy };
      };
      function updateVv() {
        var vv = window.visualViewport;
        var rawW = Math.round((vv && vv.width) || document.documentElement.clientWidth || window.innerWidth || 844);
        var rawH = Math.round((vv && vv.height) || document.documentElement.clientHeight || window.innerHeight || 390);
        var isPhoneTouch =
          /iPhone|iPod|Android/i.test(navigator.userAgent || '') ||
          ((navigator.maxTouchPoints || 0) > 0 && Math.min(rawW, rawH) <= 560);
        var forceRotate = isPhoneTouch && rawW < rawH;
        var gameW = forceRotate ? rawH : rawW;
        var gameH = forceRotate ? rawW : rawH;
        curVp = { w: gameW, h: gameH, forcedRotate: forceRotate, rawW: rawW, rawH: rawH };

        var docEl = document.documentElement;
        docEl.classList.toggle('forced-landscape', forceRotate);
        docEl.classList.toggle('is-mobile-landscape', isPhoneTouch);
        docEl.style.setProperty('--app-vw', gameW + 'px');
        docEl.style.setProperty('--app-vh', gameH + 'px');
        window.dispatchEvent(new Event('grimborne-viewport'));
      }
      updateVv();
      window.addEventListener('resize', updateVv);
      window.addEventListener('orientationchange', function () {
        setTimeout(updateVv, 60);
        setTimeout(updateVv, 260);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateVv);
        window.visualViewport.addEventListener('scroll', updateVv);
      }
      function tryMobileFullscreen() {
        var isPhone =
          /iPhone|iPod|Android/i.test(navigator.userAgent || '') ||
          ((navigator.maxTouchPoints || 0) > 0 && Math.min(window.innerWidth || 844, window.innerHeight || 390) <= 560);
        if (isPhone && !document.fullscreenElement && !document.webkitFullscreenElement) {
          const el = document.documentElement;
          (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el)?.catch?.(() => {});
        }
        screen.orientation?.lock?.('landscape')?.catch?.(() => {});
      }
      document.addEventListener('pointerdown', tryMobileFullscreen, { once: true, passive: true });
      document.addEventListener('touchend', tryMobileFullscreen, { once: true, passive: true });
    })();
  </script>
  <script>
    (function () {
      var h = (location && location.hostname) || '';
      var isEmb = false;
      try { isEmb = window.self !== window.top; } catch (e) { isEmb = true; }
      if (isEmb || /yandex\./i.test(h) || /yandex/i.test(document.referrer || '')) {
        var s = document.createElement('script');
        s.src = 'https://yandex.ru/games/sdk/v2';
        s.async = true;
        s.onerror = function () { window.__yaSdkUnavailable = true; };
        document.head.appendChild(s);
      } else {
        window.__yaSdkUnavailable = true;
      }
    })();
  </script>
</head>
<body>
  <div id="app-viewport">
    <div id="fps-badge" aria-label="Счётчик кадров">120 FPS</div>
    <!-- Стартовый экран загрузки Замка Пепла -->
    <div id="splash-screen" role="status" aria-live="polite">
      <div class="splash-vignette"></div>
      <div class="splash-bottom-box">
        <div class="splash-ornament">✦ &nbsp; ОХОТНИКИ МРАКА &nbsp; ✦</div>
        <div class="splash-bar-track">
          <div id="splash-bar-fill" class="splash-bar-fill"></div>
        </div>
        <div class="splash-status-row">
          <span id="splash-status-text">Пробуждение Замка Пепла…</span>
          <span id="splash-percent">0%</span>
        </div>
      </div>
    </div>

    <canvas id="game-canvas" aria-label="Охотники Мрака — Замок Пепла"></canvas>
    <div id="ui-root"></div>
  </div>

  <script>
    // Failsafe immediate splash progress ticker: starts moving at 0ms and finishes cleanly at ~3.0s
    (function () {
      var splashEl = document.getElementById('splash-screen');
      var fillEl = document.getElementById('splash-bar-fill');
      var pctEl = document.getElementById('splash-percent');
      var txtEl = document.getElementById('splash-status-text');
      var start = performance.now();
      var duration = 2400;
      var engineReady = false;
      var assetRatio = 0;
      var closed = false;

      function closeSplash() {
        if (closed || !splashEl) return;
        closed = true;
        if (fillEl) fillEl.style.width = '100%';
        if (pctEl) pctEl.textContent = '100%';
        if (txtEl) txtEl.textContent = 'Замок Пепла открыт';
        splashEl.classList.add('is-hidden');
        setTimeout(function () {
          if (splashEl && splashEl.parentNode) splashEl.parentNode.removeChild(splashEl);
        }, 650);
      }

      window.__setSplashAssetProgress = function (loaded, total) {
        if (total > 0) {
          assetRatio = Math.max(assetRatio, Math.min(1, loaded / total));
        }
      };

      window.__notifyEngineReady = function () {
        engineReady = true;
      };

      function tick(now) {
        if (closed) return;
        var elapsed = now - start;
        var t = Math.min(1, elapsed / duration);
        var cap = engineReady ? 100 : 95;
        var eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        var timedPct = eased * 88;
        var realPct = assetRatio * 95;
        var pct = engineReady ? 100 : Math.min(cap, Math.round(Math.max(timedPct, realPct)));
        if (fillEl) fillEl.style.width = pct + '%';
        if (pctEl) pctEl.textContent = pct + '%';
        if (txtEl) {
          if (engineReady || pct >= 96) txtEl.textContent = 'Готово к охоте!';
          else if (pct >= 68) txtEl.textContent = 'Подготовка арены и монстров…';
          else if (pct >= 34) txtEl.textContent = 'Быстрая загрузка героя и оружия…';
        }
        // Keep splash visible until 3D scene + UI have rendered their first frame (generous 38s mobile ceiling)
        if ((elapsed >= 700 && engineReady) || elapsed >= 38000) {
          closeSplash();
        } else {
          requestAnimationFrame(tick);
        }
      }
      // Prevent iOS Safari pinch-zoom & gesture bounce during gameplay
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });

      requestAnimationFrame(tick);
    })();
  </script>
  <script type="module" src="./js/main.js?v=20261124z99"></script>
</body>
</html>
